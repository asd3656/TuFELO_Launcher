name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build exe
        run: pyinstaller TuFlauncher.spec

      - name: Extract version from tag
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "TuFlauncher v${{ steps.ver.outputs.VERSION }}"
          files: dist/TuFlauncher.exe

      - name: Update Supabase settings
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.VERSION }}"
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/TuFlauncher.exe"
          $body = @{ current_version = $version; screp_url = $url } | ConvertTo-Json
          Invoke-RestMethod `
            -Uri "https://ypwcyorlzwyegjtwcqzw.supabase.co/rest/v1/settings?id=eq.1" `
            -Method PATCH `
            -Headers @{
              apikey        = "${{ secrets.SUPABASE_SERVICE_KEY }}"
              Authorization = "Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}"
              "Content-Type" = "application/json"
              Prefer        = "return=minimal"
            } `
            -Body $body
